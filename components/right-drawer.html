<div class="drawer drawer-right" id="drawerRight">
    <div class="drawer-header">
        <div class="drawer-title">表单编辑</div>
        <div class="drawer-menu" id="btn-close-form">&#10005;</div>
    </div>

    <div class="drawer-form-body">
        <!-- 基础信息 -->
        <div class="form-group">
            <label>卡名</label>
            <input type="text" data-key="cardName" placeholder="输入卡名" />
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>费用</label>
                <input type="number" data-key="cost" placeholder="费用" />
            </div>
            <div class="form-group">
                <label>阶级</label>
                <input type="number" data-key="rank" placeholder="阶级" />
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>速度</label>
                <input type="number" data-key="speed" placeholder="速度" />
            </div>
            <div class="form-group">
                <label>生命</label>
                <input type="number" data-key="life" placeholder="生命" />
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0" />

        <!-- 等级表 -->
        <div class="form-group">
            <label>等级表 (格式: 叠卡数-力量)</label>
            <div class="form-row">
                <div class="input-with-label">
                    <span>lv1</span>
                    <input type="text" data-key="lv1" />
                </div>
                <div class="input-with-label">
                    <span>lv2</span>
                    <input type="text" data-key="lv2" />
                </div>
                <div class="input-with-label">
                    <span>lv3</span>
                    <input type="text" data-key="lv3" />
                </div>
            </div>
        </div>

        <hr style="border: none; border-top: 1px solid #eee; margin: 20px 0" />

        <!-- 文本区 -->
        <div class="form-group">
            <label>怪兽效果</label>
            <textarea
                rows="5"
                data-key="effects"
                placeholder="输入效果文本..."
            ></textarea>
        </div>

        <div class="form-group">
            <label>插件效果</label>
            <textarea
                rows="3"
                data-key="plugin"
                placeholder="输入插件效果..."
            ></textarea>
        </div>
    </div>
</div>
